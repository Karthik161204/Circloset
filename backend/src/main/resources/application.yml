spring:
  application:
    name: circloset-backend
  datasource:
    url: ${SUPABASE_DB_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${SUPABASE_DB_USER:postgres}
    password: ${SUPABASE_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

supabase:
  url: ${SUPABASE_URL:https://jjvnlsfjnujniyicrpxi.supabase.co}
  service-key: ${SUPABASE_SERVICE_ROLE_KEY:}
  storage-bucket: ${SUPABASE_STORAGE_BUCKET:circloset}

app:
  frontend-origin: ${APP_ORIGIN:http://localhost:3000}
